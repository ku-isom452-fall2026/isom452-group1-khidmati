name: Deploy Static Site to GitHub Pages

on:
  # Runs whenever you push code to the main branch
  push:
    branches: [ "main" ]

  # Allows you to trigger deployment manually from the Actions tab
  workflow_dispatch:

# Sets permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ensures only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true


      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          # '.' uploads everything in your root repository folder
          path: './khidmati'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
